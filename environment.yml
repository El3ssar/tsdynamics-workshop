# Conda environment for the TSDynamics workshop.
#
# * Binder uses this file (repo2docker) to pin Python 3.12 — REQUIRED, because tsdynamics
#   ships cp312-abi3 wheels that will not install on older Pythons.
# * Local conda users:  conda env create -f environment.yml && conda activate tsdynamics-workshop
name: tsdynamics-workshop
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ffmpeg            # enables .mp4 animation export (gif export needs nothing extra)
  - pip
  - pip:
      - tsdynamics[viz,interactive]==5.3.1
      - jupyterlab>=4.2
      - notebook>=7.2
      - ipywidgets>=8.1
      - matplotlib>=3.9
      - plotly>=6,<7
      - pandas>=2.2
      - imageio>=2.34
      - imageio-ffmpeg>=0.5
      - pillow>=10
      - tqdm>=4.66
